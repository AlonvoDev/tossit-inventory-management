<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TossIt V0 — אב־טיפוס עיצוב קומפקטי</title>
<!--
  V0 visual prototype (Claude, 2026-11-25). Synthetic data only. Not a production route, no network,
  no persistence, no OCR. Scan fixtures mirror the C0a DTOs in src/domain/dateEvidence.ts
  (DateScanResult version 1). See README.md in this folder for states and URL parameters.
-->
<style>
  :root {
    --green: #1d6a4e;
    --green-strong: #155239;
    --green-tint: #edf5f0;
    --text: #151a21;
    --muted: #5a6371;
    --faint: #8a929e;
    --line: #e4e7eb;
    --line-strong: #cfd4da;
    --bg: #ffffff;
    --bg-soft: #f6f7f8;
    --red: #b42318;
    --red-tint: #fdf1f0;
    --amber: #a1480a;
    --amber-tint: #fdf5ec;
    --blue: #1f5f8b;
    --blue-tint: #eef5fa;
    --radius: 6px;
    --tap: 44px;
    --font: "Assistant", "Heebo", "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 20px; height: 20px; flex: none; fill: currentColor; }

  /* ---------- prototype chrome (not part of the product) ---------- */
  .proto { background: #20242b; color: #e9ecef; font-size: 13px; }
  .proto summary { padding: 6px 12px; cursor: pointer; }
  .proto-body { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 4px 12px 10px; }
  .proto label { display: flex; gap: 6px; align-items: center; }
  .proto select { background: #2e333b; color: #fff; border: 1px solid #4a515c; border-radius: 4px; padding: 2px 4px; font-size: 13px; }
  .bare .proto { display: none; }

  /* ---------- app bar ---------- */
  .appbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  .appbar-row { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 4px; max-width: 1180px; margin: 0 auto; }
  .icon-btn { width: var(--tap); height: var(--tap); display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; border-radius: var(--radius); color: var(--text); }
  .icon-btn:hover { background: var(--bg-soft); }
  .icon-btn[aria-disabled="true"] { color: var(--faint); cursor: not-allowed; }
  .brand { font-weight: 700; font-size: 18px; margin-inline-start: 4px; }
  .page-title { font-size: 18px; font-weight: 700; margin: 0; }
  .spacer { flex: 1; }
  .shift { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 16px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .shift .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .shift.off .dot { background: var(--faint); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--green-tint); color: var(--green-strong); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .nav { display: none; gap: 2px; margin-inline-start: 16px; }
  .nav a { display: inline-flex; align-items: center; height: 52px; padding: 0 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 600; }
  .nav a[aria-current="page"] { color: var(--text); border-bottom-color: var(--green); }

  .banner { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .banner.offline { background: var(--amber-tint); color: #6b3507; }
  .banner .count { margin-inline-start: auto; font-weight: 700; white-space: nowrap; }

  /* ---------- controls ---------- */
  main { max-width: 1180px; margin: 0 auto; }
  .controls { padding: 10px 12px 4px; display: grid; gap: 8px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { min-height: 36px; padding: 0 14px; border: 0; background: var(--bg); font-weight: 600; color: var(--muted); position: relative; }
  .seg button + button { border-inline-start: 1px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--green); color: #fff; }
  /* 44px hit area around 36px visuals */
  .seg button::after { content: ""; position: absolute; inset: -4px 0; }
  .chip::after { content: ""; position: absolute; inset: -5px 0; }
  .dept-label { font-weight: 700; font-size: 16px; }
  .filters { display: flex; gap: 8px; align-items: center; }
  .search { flex: 1; position: relative; min-width: 0; }
  .search input { width: 100%; height: var(--tap); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 0 38px 0 36px; background: var(--bg); }
  .search .i { position: absolute; right: 10px; top: 12px; color: var(--faint); }
  .search .clear { position: absolute; left: 0; top: 0; }
  .select { height: var(--tap); border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); padding: 0 8px; max-width: 46%; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { position: relative; flex: none; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line-strong); background: var(--bg); font-size: 14px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { border-color: var(--green); background: var(--green-tint); color: var(--green-strong); }
  .chip .n { font-variant-numeric: tabular-nums; font-weight: 700; }
  .chip.expired .n { color: var(--red); }
  .chip.expiring .n { color: var(--amber); }

  /* ---------- list ---------- */
  .list { border-top: 1px solid var(--line); }
  .group { position: sticky; top: 52px; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--bg-soft); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); }
  .group.expired { color: var(--red); }
  .group.expiring { color: var(--amber); }
  .colhead { display: none; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "name when act" "meta when act"; column-gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); position: relative; }
  .row::before { content: ""; position: absolute; inset-inline-start: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: transparent; }
  .row.expired::before { background: var(--red); }
  .row.expiring::before { background: #d9822b; }
  .row .name { grid-area: name; font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
  .row .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; margin-inline-start: 6px; vertical-align: 2px; }
  .row .meta { grid-area: meta; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; }
  .row .meta .qty { color: var(--text); font-weight: 600; }
  .row .meta .sep { color: var(--line-strong); }
  .row .when { grid-area: when; text-align: left; white-space: nowrap; }
  .row .left { font-weight: 700; font-size: 15px; }
  .row .exact { font-size: 13px; color: var(--muted); }
  .row.expired .left { color: var(--red); }
  .row.expiring .left { color: var(--amber); }
  .row.ok .left { color: var(--text); font-weight: 600; }
  .row .act { grid-area: act; }
  .row .sync { grid-column: 1 / -1; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .row .sync.pending { color: var(--muted); }
  .row .sync.failed { color: var(--red); }
  .row .sync .i { width: 16px; height: 16px; }
  .link-btn { border: 0; background: none; color: inherit; text-decoration: underline; padding: 0 8px; min-height: 44px; font-weight: 700; }
  .btn { min-height: var(--tap); padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--bg); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: var(--bg-soft); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary:hover { background: var(--green-strong); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .btn.small { min-height: var(--tap); padding: 0 12px; font-size: 15px; }
  .btn.block { width: 100%; }
  .row .act .btn { color: var(--green-strong); }
  .closed-line { grid-area: when; text-align: left; font-size: 14px; color: var(--muted); }

  .state { padding: 40px 20px; text-align: center; color: var(--muted); }
  .state h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
  .state p { margin: 0 0 16px; }
  .state.error h2 { color: var(--red); }
  .skel { height: 64px; border-bottom: 1px solid var(--line); padding: 12px; }
  .skel span { display: block; height: 12px; background: #eceef1; border-radius: 4px; margin-bottom: 8px; }
  @media (prefers-reduced-motion: no-preference) { .skel span { animation: pulse 1.2s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .5; } }

  /* bottom action bar (phone) */
  .actionbar { position: sticky; bottom: 0; z-index: 15; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 12px max(8px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
  .actionbar .note { font-size: 14px; color: var(--muted); flex: 1; }
  .open-inline { display: none; }

  /* ---------- sheets / dialogs ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15, 20, 25, .45); z-index: 40; display: flex; align-items: stretch; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; height: 100%; display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
  .sheet-head h2 { font-size: 18px; margin: 0; flex: 1; padding-inline-start: 8px; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
  .sheet-foot { border-top: 1px solid var(--line); padding: 10px 16px max(10px, env(safe-area-inset-bottom)); display: grid; gap: 8px; background: var(--bg); }
  .foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .foot-actions .btn { flex: 1 1 auto; }
  .foot-actions .btn.primary, .foot-actions .btn.danger { flex: 2 1 auto; }
  .field { display: grid; gap: 4px; margin-bottom: 16px; }
  .field > .label, .field > label { font-size: 14px; font-weight: 700; color: var(--muted); }
  .help { font-size: 13px; color: var(--muted); }
  .err { font-size: 13px; color: var(--red); font-weight: 600; }
  .input { height: var(--tap); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 0 10px; background: var(--bg); width: 100%; }
  .input[aria-invalid="true"] { border-color: var(--red); }
  .pick-list { border: 1px solid var(--line); border-radius: var(--radius); max-height: 236px; overflow-y: auto; }
  .pick { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); text-align: start; }
  .pick:last-child { border-bottom: 0; }
  .pick .pn { font-weight: 700; flex: 1; }
  .pick .pd { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pick[aria-pressed="true"] { background: var(--green-tint); }
  .picked { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--green); background: var(--green-tint); border-radius: var(--radius); }
  .picked .pn { font-weight: 700; flex: 1; }
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; width: max-content; }
  .stepper button { width: 48px; border: 0; background: var(--bg-soft); font-size: 22px; font-weight: 700; }
  .stepper input { width: 84px; height: 46px; border: 0; border-inline: 1px solid var(--line-strong); text-align: center; font-weight: 700; font-size: 18px; }
  .unit { align-self: center; padding: 0 12px; font-weight: 700; color: var(--muted); }
  .opt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt-chips .chip { height: 40px; }
  .note-line { font-size: 14px; color: var(--muted); padding: 8px 0; border-top: 1px solid var(--line); }
  .note-line strong { color: var(--text); }
  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .evidence { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .ev-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ev-row .ev-main { flex: 1; }
  .ev-row .ev-val { font-weight: 700; }
  .ev-row .ev-src { font-size: 13px; color: var(--muted); }
  .two { display: flex; gap: 8px; flex-wrap: wrap; }
  .two .btn { flex: 1; min-width: 130px; }
  .alert { border-radius: var(--radius); padding: 8px 12px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .alert.error { background: var(--red-tint); color: #7a1a12; }
  .alert.info { background: var(--blue-tint); color: #17445f; }
  .alert.success { background: var(--green-tint); color: var(--green-strong); }
  .alert.warn { background: var(--amber-tint); color: #6b3507; }
  .alert .i { width: 18px; height: 18px; margin-top: 1px; }
  .proto-note { font-size: 12px; color: var(--faint); margin-top: 8px; }

  .summary { padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .summary .sn { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .summary dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 14px; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; }
  .choice { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg); text-align: start; margin-bottom: 8px; }
  .choice[aria-checked="true"] { border-color: var(--green); background: var(--green-tint); }
  .choice .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: none; position: relative; }
  .choice[aria-checked="true"] .radio { border-color: var(--green); }
  .choice[aria-checked="true"] .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--green); }
  .choice .ct { font-weight: 700; display: block; }
  .choice .cd { font-size: 14px; color: var(--muted); }
  .choice[aria-disabled="true"] { opacity: .75; cursor: default; background: var(--bg-soft); }

  /* scan */
  .viewfinder { position: relative; background: #1b1f24; border-radius: var(--radius); aspect-ratio: 4 / 3; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .viewfinder svg.label { width: 72%; height: auto; }
  .viewfinder .frame { position: absolute; inset: 14% 10%; border: 2px solid rgba(255,255,255,.85); border-radius: 6px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
  .viewfinder .vf-note { position: absolute; bottom: 8px; inset-inline: 0; text-align: center; color: #fff; font-size: 13px; }
  .thumb { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .thumb .tv { width: 112px; flex: none; background: #1b1f24; border-radius: 4px; padding: 6px; }
  .thumb .tv svg { width: 100%; height: auto; display: block; }
  .cand { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; }
  .cand[data-selected="true"] { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .cand.blocked { background: var(--bg-soft); }
  .cand-head { display: flex; gap: 10px; align-items: flex-start; }
  .cand-head .choice { margin: 0; border: 0; padding: 0; min-height: 44px; background: none; flex: 1; }
  .raw { font-size: 13px; color: var(--muted); }
  .raw q { color: var(--text); font-weight: 700; quotes: "„" "”"; }
  .issues { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .issue { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--amber-tint); color: #6b3507; }
  .date-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .date-grid .input { text-align: center; padding: 0 4px; }
  .time-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-width: 220px; }
  .mini { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  .check { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
  .check input { width: 20px; height: 20px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; margin: 0 auto 12px; }
  @media (prefers-reduced-motion: no-preference) { .spinner { animation: spin 1s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- tablet / desktop ---------- */
  @media (min-width: 600px) {
    .scrim { align-items: center; padding: 24px; }
    .sheet { width: 520px; height: auto; max-height: 88vh; border-radius: 8px; overflow: hidden; }
    .sheet.wide { width: 720px; }
  }
  @media (min-width: 900px) {
    .nav { display: flex; }
    .appbar-row { padding: 0 16px; }
    .menu-btn { display: none !important; }
    .controls { padding: 18px 24px 8px; grid-template-columns: 1fr; }
    .filters { gap: 10px; }
    .filters .search { flex: 0 1 340px; }
    .filters .chips { padding: 0; }
    .open-inline { display: inline-flex; margin-inline-start: auto; }
    .actionbar { display: none; }
    .list { margin: 0 24px 24px; border: 1px solid var(--line); border-radius: 8px; overflow: clip; }
    .op-word { display: none; }
    .colhead { display: grid; position: sticky; top: 52px; z-index: 6; background: var(--bg); font-size: 13px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); }
    .row, .colhead { grid-template-columns: minmax(220px, 2.2fr) 0.8fr 1.2fr 1.1fr 1.1fr 0.9fr 128px; grid-template-areas: none; padding: 0 16px; column-gap: 12px; }
    .colhead > div { padding: 8px 0; }
    .row { min-height: 52px; padding-block: 6px; }
    .row .name, .row .meta, .row .when, .row .act { grid-area: auto; }
    .row .meta { display: contents; font-size: 15px; }
    .row .meta .sep { display: none; }
    .row .meta > span { color: var(--text); }
    .row .when { display: contents; }
    .row .left, .row .exact { text-align: start; font-size: 15px; }
    .row .exact { color: var(--text); }
    .row .act { justify-self: end; }
    .row .sync { grid-column: 1 / -1; margin: 0 0 4px; }
    .group { top: 89px; padding: 6px 16px; }
    .closed-line { grid-column: 2 / -1; text-align: start; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
/* =====================================================================================
   Synthetic data. Fixed clock: 2026-11-25 19:00 Asia/Jerusalem (17:00Z).
   ===================================================================================== */
const NOW = Date.UTC(2026, 10, 25, 17, 0);
const H = 3600e3, D = 24 * H;
const EXPIRING_WINDOW = 72 * H; // mirrors the current selectItems window (policy follow-up UI1-1)

const DEPTS = { bar: 'בר', kitchen: 'מטבח' };
const FRIDGES = {
  bar: ['מקרר בר ראשי', 'מקרר יין', 'מקפיא בר'],
  kitchen: ['מקרר מטבח 1', 'מקרר מטבח 2'],
};
const PRODUCTS = {
  bar: [
    { id: 'p1', name: 'לימון חתוך', unit: 'units', days: 2, fridge: 'מקרר בר ראשי' },
    { id: 'p2', name: 'נענע טרייה', unit: 'kg', days: 1, fridge: 'מקרר בר ראשי' },
    { id: 'p3', name: 'שמנת מתוקה', unit: 'units', days: 3, fridge: 'מקרר בר ראשי' },
    { id: 'p4', name: 'רוטב פסיפלורה ביתי עם וניל ומעט צ׳ילי לקוקטיילים של הערב', unit: 'kg', days: 3, fridge: 'מקרר יין' },
    { id: 'p5', name: 'פירה תות', unit: 'kg', days: 5, fridge: 'מקפיא בר' },
    { id: 'p6', name: 'מיץ תפוזים סחוט', unit: 'units', days: 2, fridge: 'מקרר בר ראשי' },
    { id: 'p7', name: 'סירופ סוכר ביתי', unit: 'kg', days: 7, fridge: 'מקרר בר ראשי' },
    { id: 'p8', name: 'חלב שקדים', unit: 'units', days: 7, fridge: 'מקרר יין' },
  ],

  const single = fx.candidates.filter(c => c.meaning !== 'manufactured-at').length === 1;
  if (single && !s.selected) s.selected = fx.candidates.find(c => c.meaning !== 'manufactured-at').id; // only selection, never confirmation
  const sel = fx.candidates.find(c => c.id === s.selected);
  const problem = sel ? candidateProblem(sel) : 'בחר אחת מהאפשרויות';
  return sheetFrame('scan', title, false, `
    ${s.manual ? '' : `<div class="thumb"><div class="tv">${labelSvg(s.source).replace('class="label"', '')}</div><div><strong>${s.source === 'packaging' ? 'אריזה' : 'תווית צוות'}</strong><div class="help">${fx.candidates.length > 1 ? `זוהו ${fx.candidates.length} תאריכים. בדוק ובחר.` : 'בדוק את התאריך מול התמונה לפני האישור.'}</div></div></div>`}
    <div role="radiogroup" aria-label="תאריכים לבחירה">${fx.candidates.map(c => candidateHtml(c, single)).join('')}</div>
    ${s.attempted && !sel ? '<div class="err" role="alert">בחר אחת מהאפשרויות לפני האישור.</div>' : ''}
    ${s.manual ? '' : '<p class="proto-note">הצעה מהסריקה אינה נשמרת. רק "אישור התאריך" מוסיף אותה לטופס, ועדיין צריך לשלוח את הטופס עצמו.</p>'}`,
    `<div class="foot-actions"><button class="btn" data-act="scan-cancel">ביטול</button>${s.manual ? '' : '<button class="btn" data-act="scan-retake">צילום מחדש</button>'}<button class="btn primary" data-act="scan-confirm" aria-disabled="${!!problem}">אישור התאריך</button></div>`, true);
}
function confirmScan() {
  const s = S.scan;
  const fx = s.manual ? s.result : SCAN_FIXTURES[S.fixture];
  const sel = fx.candidates.find(c => c.id === s.selected);
  s.attempted = true;
  if (!sel || candidateProblem(sel)) { render(); return; }
  const e = editsFor(sel);
  // ConfirmedDateEvidence: created only here, from an explicit user action.
  S.open.evidence = S.open.evidence.filter(x => x.meaning !== e.meaning)
    .concat({ source: s.manual ? 'manual' : s.source, meaning: e.meaning, reading: readingFrom(e), confirmed: true });
  S.scan = null; S.sheet = 'open'; render(); focusSheet();
}

/* =====================================================================================
   Close sheet
   ===================================================================================== */
function closeSheet() {
  const c = S.close, i = ITEMS.find(x => x.id === c.id);
  const busy = c.phase === 'busy';
  const st = status(i);
  const footMsg = c.error ? `<div class="alert error" role="alert">${icon('alert')}<span>${esc(c.error)}</span></div>`
    : c.notice ? `<div class="alert ${c.notice.kind}" role="status">${icon(c.notice.kind === 'success' ? 'check' : 'clock')}<span>${esc(c.notice.text)}</span></div>` : '';
  const done = !!c.notice;
  return sheetFrame('close', 'סגירת פריט', busy, `
    <div class="summary">
      <div class="sn">${esc(i.name)}${S.dept === 'all' ? ` <span class="tag" style="font-size:12px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted)">${DEPTS[i.dept]}</span>` : ''}</div>
      <dl>
        <dt>כמות</dt><dd class="num">${qty(i.amount, i.unit)}</dd>
        <dt>מקרר</dt><dd>${esc(i.fridge)}</dd>
        <dt>נפתח</dt><dd><span class="ltr num">${dt(i.openedAt)}</span> · ${esc(i.by)}</dd>
        <dt>תוקף</dt><dd><span class="ltr num">${dt(i.expiry)}</span> · <strong style="color:${st === 'expired' ? 'var(--red)' : st === 'expiring' ? 'var(--amber)' : 'inherit'}">${remaining(i.expiry)}</strong></dd>
      </dl>
    </div>
    ${done ? '' : `
    <div role="radiogroup" aria-label="מה קרה לפריט">
      <button class="choice" role="radio" aria-checked="${c.action === 'finished'}" data-act="close-action" data-v="finished" ${busy ? 'disabled' : ''}><span class="radio" aria-hidden="true"></span><span><span class="ct">נגמר</span><span class="cd">נוצל במלואו, בלי פסולת</span></span></button>
      <button class="choice" role="radio" aria-checked="${c.action === 'discarded'}" data-act="close-action" data-v="discarded" ${busy ? 'disabled' : ''}><span class="radio" aria-hidden="true"></span><span><span class="ct">נזרק</span><span class="cd">חלק מהכמות או כולה נזרקה</span></span></button>
    </div>
    ${c.action === 'discarded' ? `
      <div class="field" style="margin-top:8px"><label for="dq">כמות שנזרקה</label>
        <div style="display:flex;gap:8px;align-items:center"><input id="dq" class="input num" style="max-width:140px" inputmode="${i.unit === 'kg' ? 'decimal' : 'numeric'}" dir="ltr" value="${esc(c.amount)}" data-bind="close.amount" aria-invalid="${!!c.amountErr}" ${busy ? 'disabled' : ''} /><span class="unit">${UNIT[i.unit]}, מתוך ${qty(i.amount, i.unit)}</span></div>
        ${c.amountErr ? `<span class="err">${esc(c.amountErr)}</span>` : '<span class="help">ברירת המחדל: כל הכמות. אם נשאר חלק, הוא נסגר כנגמר.</span>'}
      </div>
      <div class="field"><span class="label">סיבה</span>
        <div class="opt-chips" role="radiogroup" aria-label="סיבת זריקה">${Object.entries(REASONS).map(([k, v]) => `<button class="chip" role="radio" aria-checked="${c.reason === k}" aria-pressed="${c.reason === k}" data-act="reason" data-v="${k}" ${busy ? 'disabled' : ''}>${v}</button>`).join('')}</div>
        ${c.reasonErr ? `<span class="err">${esc(c.reasonErr)}</span>` : ''}
      </div>
      ${c.reason === 'other' ? `<div class="field"><label for="note">פירוט</label><input id="note" class="input" value="${esc(c.note)}" data-bind="close.note" ${busy ? 'disabled' : ''} /></div>` : ''}` : ''}`}`,
    done ? `${footMsg}<button class="btn block" data-act="dismiss">סגירה</button>`
      : `${footMsg}<div class="foot-actions"><button class="btn" data-act="dismiss" ${busy ? 'disabled' : ''}>ביטול</button><button class="btn ${c.action === 'discarded' ? 'danger' : 'primary'}" data-act="submit-close" ${!c.action || busy ? 'disabled' : ''}>${busy ? 'שולח...' : c.action === 'discarded' ? 'סמן כנזרק' : c.action === 'finished' ? 'סמן כנגמר' : 'בחר מה קרה'}</button></div>`);
}
function submitClose() {
  const c = S.close, i = ITEMS.find(x => x.id === c.id);
  c.error = null; c.amountErr = null; c.reasonErr = null;
  if (c.action === 'discarded') {
    const raw = String(c.amount).trim();
    const n = Number(raw);
    const ok = i.unit === 'kg' ? /^\d+(\.\d+)?$/.test(raw) && n > 0 : /^\d+$/.test(raw) && n >= 1;
    if (!ok || n > i.amount) c.amountErr = `יש להזין כמות בין ${i.unit === 'kg' ? 'מעל 0' : '1'} ל־${i.amount}`;
    if (!c.reason) c.reasonErr = 'בחר סיבה';
    if (c.amountErr || c.reasonErr) { render(); return; }
  }
  c.phase = 'busy'; render();
  const result = S.offline ? 'pending' : S.outcome;
  setTimeout(() => {
    c.phase = 'idle';
    if (result === 'error') c.error = 'השליחה לא הושלמה והפריט לא עודכן. נסה שוב — ניסיון חוזר לא יכפיל את הפעולה.';
    else c.notice = result === 'pending'
      ? { kind: 'info', text: 'הסגירה נשמרה במכשיר וממתינה לשליחה. היא עדיין לא נשמרה בשרת.' }
      : { kind: 'success', text: c.action === 'discarded' ? 'הפריט סומן כנזרק.' : 'הפריט סומן כנגמר.' };
    render();
  }, S.outcome === 'slow' ? 60000 : 900);
}

/* =====================================================================================
   Sheet frame, focus and dismissal (busy blocks every dismissal path, as in UI2-R1)
   ===================================================================================== */
function sheetFrame(kind, title, busy, body, foot, isScan = false) {
  return `<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-kind="${kind}">
    <div class="sheet-head">
      ${isScan ? `<button class="icon-btn" data-act="scan-cancel" aria-label="חזרה לטופס">${icon('back')}</button>` : ''}
      <h2 id="sheet-title" tabindex="-1">${esc(title)}</h2>
      <button class="icon-btn" data-act="${isScan ? 'scan-cancel' : 'dismiss'}" aria-label="סגירה" ${busy ? 'aria-disabled="true" title="ממתין לתשובה מהשרת"' : ''}>${icon('close')}</button>
    </div>
    <div class="sheet-body">${body}</div>
    <div class="sheet-foot">${foot}</div>
  </div></div>`;
}
let opener = null;
function focusSheet() { requestAnimationFrame(() => document.getElementById('sheet-title')?.focus()); }
function isBusy() { return (S.sheet === 'open' && S.open?.phase === 'busy') || (S.sheet === 'close' && S.close?.phase === 'busy'); }
function dismiss() {
  if (isBusy()) return;
  S.sheet = null; S.close = null;
  if (S.open && !S.open.product && !S.open.evidence.length) S.open = null; // keep a started draft
  render();
  opener?.focus?.();
}

/* =====================================================================================
   Render + events
   ===================================================================================== */
function protoBar() {
  const sel = (key, label, opts) => `<label>${label}<select data-proto="${key}">${opts.map(([v, t]) => `<option value="${v}" ${String(S[key]) === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  return `<details class="proto" ${params.get('proto') === '1' ? 'open' : ''}><summary>בקרי אב־טיפוס (לא חלק מהמוצר)</summary><div class="proto-body">
    ${sel('role', 'תפקיד', [['staff', 'עובד (בר)'], ['manager', 'מנהל מחלקה (מטבח)'], ['admin', 'מנהל מערכת']])}
    ${sel('data', 'נתונים', [['busy', 'מלאי עמוס'], ['empty', 'ריק'], ['loading', 'טעינה'], ['error', 'שגיאת טעינה']])}
    ${sel('offline', 'חיבור', [['false', 'מחובר'], ['true', 'לא מחובר']])}
    ${sel('shift', 'משמרת', [['true', 'במשמרת'], ['false', 'לא במשמרת']])}
    ${sel('outcome', 'תוצאת שליחה', [['synced', 'נשמר בשרת'], ['pending', 'ממתין (במכשיר)'], ['error', 'נכשל'], ['slow', 'תקוע (בדיקת חסימת סגירה)']])}
    ${sel('fixture', 'תוצאת סריקה', [['packaging', 'אריזה — תאריך אחד'], ['staffIncomplete', 'תווית — חסרים שנה ושעה'], ['ambiguous', 'תווית — דו־משמעי'], ['manufactured', 'אריזה — ייצור + תוקף + לא ידוע'], ['unreadable', 'לא קריא']])}
    ${sel('camera', 'מצלמה', [['granted', 'מותרת'], ['denied', 'נדחתה']])}
  </div></details>`;
}
function render() {
  const a = document.activeElement;
  const focusId = a && a.id ? a.id : null;
  const selStart = a && 'selectionStart' in a ? a.selectionStart : null;
  const bodyScroll = document.querySelector('.sheet-body')?.scrollTop ?? 0;
  document.body.classList.toggle('bare', params.get('bare') === '1');
  const sheet = S.sheet === 'open' ? openSheet() : S.sheet === 'close' ? closeSheet() : S.sheet === 'scan' ? scanSheet() : '';
  document.getElementById('root').innerHTML = `${protoBar()}<div class="app" ${S.sheet ? 'aria-hidden="true" inert' : ''}>${appBar()}<main>${controls()}${listHtml()}</main>${actionBar()}</div>${sheet}`;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (selStart != null && 'setSelectionRange' in el) { try { el.setSelectionRange(selStart, selStart); } catch (_) {} } }
  }
  const sb = document.querySelector('.sheet-body'); if (sb) sb.scrollTop = bodyScroll;
}
function setPath(path, value) {
  const parts = path.split('.');
  if (parts[0] === 'edit') { S.scan.edits[parts[1]][parts[2]] = value; return; }
  let o = S; for (let n = 0; n < parts.length - 1; n++) o = o[parts[n]];
  o[parts[parts.length - 1]] = value;
}
document.addEventListener('input', ev => {
  const b = ev.target.dataset.bind; if (!b) return;
  setPath(b, ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value);
  if (b === 'open.amount') S.open.amountInvalid = false;
  if (b.endsWith('.dayOnly') && ev.target.checked) { const id = b.split('.')[1]; S.scan.edits[id].hour = ''; S.scan.edits[id].minute = ''; }
  render();
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset.proto;
  if (k) {
    const v = ev.target.value;
    S[k] = v === 'true' ? true : v === 'false' ? false : v;
    if (k === 'role') { S.dept = allowedDepts()[0]; S.fridge = 'all'; S.sheet = null; S.open = null; S.close = null; }
    render(); return;
  }
  const b = ev.target.dataset.bind;
  if (b && ev.target.tagName === 'SELECT') { setPath(b, ev.target.value); render(); }
});
document.addEventListener('click', ev => {
  const scrim = ev.target.dataset && ev.target.dataset.scrim;
  if (scrim) { if (S.sheet === 'scan') return; dismiss(); return; }
  const btn = ev.target.closest('[data-act]'); if (!btn || btn.disabled) return;
  const { act, v, id } = btn.dataset;
  switch (act) {
    case 'dept': S.dept = v; S.fridge = 'all'; break;
    case 'mode': S.mode = v; S.status = 'all'; break;
    case 'status': S.status = v; break;
    case 'clear-q': S.q = ''; break;
    case 'reset-filters': S.q = ''; S.status = 'all'; S.fridge = 'all'; break;
    case 'retry': S.data = 'busy'; break;
    case 'start-shift': S.shift = true; break;
    case 'open-sheet': if (!canOpen()) return; opener = btn; S.open = S.open || newOpen(); S.sheet = 'open'; render(); focusSheet(); return;
    case 'close-sheet': opener = btn; S.close = { id, action: null, amount: String(ITEMS.find(x => x.id === id).amount), reason: null, note: '', phase: 'idle' }; S.sheet = 'close'; render(); focusSheet(); return;
    case 'dismiss': dismiss(); return;
    case 'open-dept': S.open.dept = v; S.open.fridge = ''; break;
    case 'pick': { const p = productById(S.open.dept, id); Object.assign(S.open, { product: id, amount: '1', fridge: p.fridge, error: null, notice: null, amountInvalid: false }); break; }
    case 'change-product': S.open.product = null; S.open.operationId = null; break;
    case 'step': { const p = productById(S.open.dept, S.open.product); const st = p.unit === 'kg' ? 0.25 : 1; const n = Math.max(p.unit === 'kg' ? 0.25 : 1, (Number(S.open.amount) || 0) + st * Number(v)); S.open.amount = String(Math.round(n * 100) / 100); S.open.amountInvalid = false; break; }
    case 'open-fridge': S.open.fridge = v; break;
    case 'submit-open': submitOpen(); return;
    case 'remove-ev': if (isBusy()) return; S.open.evidence.splice(Number(btn.dataset.n), 1); break;
    case 'scan-start': startScan(); return;
    case 'manual-start': startManual(); return;
    case 'scan-source': S.scan.source = v; S.scan.step = 'capture'; break;
    case 'scan-capture': case 'scan-gallery':
      S.scan.step = 'processing'; render();
      setTimeout(() => { if (S.scan && S.scan.step === 'processing') { S.scan.step = 'review'; render(); focusSheet(); } }, 700);
      return;
    case 'scan-retake': Object.assign(S.scan, { step: 'capture', selected: null, edits: {}, attempted: false, manual: false, source: S.scan.source === 'manual' ? 'packaging' : S.scan.source }); break;
    case 'scan-cancel': S.scan = null; S.sheet = 'open'; render(); focusSheet(); return; // draft untouched
    case 'select-cand': S.scan.selected = id; S.scan.attempted = false; break;
    case 'scan-confirm': confirmScan(); return;
    case 'close-action': S.close.action = v; S.close.error = null; break;
    case 'reason': S.close.reason = v; S.close.reasonErr = null; break;
    case 'submit-close': submitClose(); return;
    default: return;
  }
  render();
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || !S.sheet) return;
  if (S.sheet === 'scan') { S.scan = null; S.sheet = 'open'; render(); focusSheet(); return; }
  dismiss();
});
window.matchMedia('(min-width: 900px)').addEventListener('change', render);

/* Deep links for screenshots/review: ?sheet=open|close|scan&step=...&pick=p1 */
(function deepLink() {
  const sheet = params.get('sheet');
  if (sheet === 'open' || sheet === 'scan' || sheet === 'manual') {
    S.open = newOpen();
    const pick = params.get('pick');
    if (pick && productById(S.open.dept, pick)) { const p = productById(S.open.dept, pick); Object.assign(S.open, { product: pick, fridge: p.fridge, amount: params.get('amount') || '1' }); }
    if (params.get('ev') === '1') S.open.evidence = [{ source: 'packaging', meaning: 'manufacturer-expiry', reading: { precision: 'day', date: { year: 2026, month: 11, day: 28 } }, confirmed: true }];
    S.sheet = 'open';
    if (params.get('phase') === 'busy') { S.outcome = 'slow'; }
    if (sheet === 'scan') { S.scan = { step: params.get('step') || 'source', source: params.get('source') || SCAN_FIXTURES[S.fixture].source, selected: null, edits: {}, manual: false, attempted: params.get('attempted') === '1' }; S.sheet = 'scan'; }
    if (sheet === 'manual') { startManual(); return; }
  }
  if (sheet === 'close') {
    const target = ITEMS.find(x => x.id === (params.get('item') || 'i1'));
    S.close = { id: target.id, action: params.get('action') || null, amount: String(target.amount), reason: params.get('reason') || null, note: '', phase: 'idle' };
    S.sheet = 'close';
  }
  render();
  if (params.get('phase') === 'busy' && S.sheet === 'open' && S.open.product) submitOpen();
  if (params.get('phase') === 'busy' && S.sheet === 'close' && S.close.action) { S.outcome = 'slow'; submitClose(); }
})();
</script>
</body>
</html>
